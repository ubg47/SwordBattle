<!DOCTYPE html><html lang="en-us"><head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eccentric Games</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <link rel="stylesheet" href="EccentricData/eccentric-style.css">
  <script src="TemplateData/gamepush-unity.js"></script>
  <script src="crazygames-sdk-v3.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }
      #part-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Comic Sans MS", "Comic Sans", cursive;
      }
      #part-loader h1 {
        font-size: 2em;
        margin-bottom: 20px;
      }
      .part-item {
        width: 400px;
        margin: 6px 0;
        font-size: 1em;
      }
      .part-label {
        margin-bottom: 3px;
      }
      .part-bar-bg {
        width: 100%;
        height: 18px;
        background: #ddd;
        border: 2px solid black;
      }
      .part-bar-fill {
        height: 100%;
        background: #f5c518;
        width: 0%;
        transition: width 0.1s;
      }
      .part-status {
        font-size: 0.85em;
        color: #555;
      }
      #overall-status {
        margin-top: 20px;
        font-size: 1.1em;
      }
    #unity-canvas {
      aspect-ratio: 16 / 9;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
  <body>
    <div id="part-loader">
      <h1>Loading...</h1>
      <div id="parts-list"></div>
      <div id="overall-status">rolling cheese wheels...</div>
    </div>

    <div id="unity-container" style="display: none">
      <canvas id="unity-canvas" width="480" height="360" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

<script>
const BUILD = "Build/";
const LOADER_URL = BUILD + "Build.loader.js";

const PART_FILES = [
  {
    name: "data",
    base: BUILD + "Build.data",
    label: "Build.data",
    parts: 3,
    mime: "application/octet-stream"
  },
  {
    name: "wasm",
    base: BUILD + "Build.wasm",
    label: "Build.wasm",
    parts: 4,
    mime: "application/wasm"
  }
];

const assembledBlobs = {};

const partsList = document.getElementById("parts-list");
const overallStatus = document.getElementById("overall-status");

function makePartRow(id, label) {
  const wrap = document.createElement("div");
  wrap.className = "part-item";

  wrap.innerHTML = `
    <div class="part-label">${label}</div>
    <div class="part-bar-bg">
      <div class="part-bar-fill" id="bar-${id}"></div>
    </div>
    <div class="part-status" id="status-${id}">waiting...</div>
  `;

  partsList.appendChild(wrap);
}

function setBar(id, percent) {
  document.getElementById("bar-" + id).style.width =
    percent + "%";
}

function setStatus(id, message) {
  document.getElementById("status-" + id).textContent =
    message;
}

async function fetchPart(url, rowId) {
  const response = await fetch(url, { cache: "no-store" });

  if (!response.ok) {
    throw new Error(
      "Missing file: " + url + " (HTTP " + response.status + ")"
    );
  }

  const total = Number(response.headers.get("Content-Length")) || 0;
  const reader = response.body.getReader();

  const chunks = [];
  let received = 0;

  while (true) {
    const result = await reader.read();

    if (result.done) break;

    chunks.push(result.value);
    received += result.value.length;

    if (total > 0) {
      const percent = Math.round(received / total * 100);
      setBar(rowId, percent);
      setStatus(rowId, percent + "%");
    } else {
      setStatus(rowId, "downloading...");
    }
  }

  setBar(rowId, 100);
  setStatus(rowId, "cheezy done");

  return new Blob(chunks);
}

async function loadFile(file) {
  const blobs = [];

  for (let i = 1; i <= file.parts; i++) {
    const rowId = file.name + "_" + i;
    const partName = file.base +
      ".part" + String(i).padStart(3, "0");

    makePartRow(
      rowId,
      file.label + " — part " + i + " of " + file.parts
    );

    setStatus(rowId, "downloading...");

    const blob = await fetchPart(partName, rowId);
    blobs.push(blob);
  }

  return new Blob(blobs, { type: file.mime });
}

async function loadAllParts() {
  try {
    for (const file of PART_FILES) {
      overallStatus.textContent =
        "LOADING " + file.label + "...";

      const blob = await loadFile(file);

      assembledBlobs[file.name] =
        URL.createObjectURL(blob);
    }

    overallStatus.textContent = "All files loaded! Starting Unity...";

    setTimeout(startUnity, 500);

  } catch (error) {
    overallStatus.textContent = "LOADING FAILED: " + error.message;
    console.error("Unity part loader error:", error);
  }
}

function startUnity() {
  document.getElementById("part-loader").style.display = "none";
  document.getElementById("unity-container").style.display = "";

  const canvas = document.querySelector("#unity-canvas");
  const loadingBar = document.querySelector("#unity-loading-bar");
  const progressBarFull = document.querySelector(
    "#unity-progress-bar-full"
  );
  const warningBanner = document.querySelector("#unity-warning");

  function unityShowBanner(message, type) {
    const div = document.createElement("div");
    div.textContent = message;

    if (type === "error") {
      div.style = "background:red;padding:10px;color:white;";
    } else if (type === "warning") {
      div.style = "background:yellow;padding:10px;";
    }

    warningBanner.appendChild(div);
    warningBanner.style.display = "block";

    if (type !== "error") {
      setTimeout(() => {
        div.remove();

        if (!warningBanner.children.length) {
          warningBanner.style.display = "none";
        }
      }, 5000);
    }
  }

  const config = {
    dataUrl: assembledBlobs.data,
    frameworkUrl: BUILD + "Build.framework.js",
    codeUrl: assembledBlobs.wasm,
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Eccentric Games",
    productName: "SwordBattle",
    productVersion: "1.0",
    showBanner: unityShowBanner
    autoSyncPersistentDataPath: true,
  };

  loadingBar.style.display = "block";

  const script = document.createElement("script");
  script.src = LOADER_URL;

  script.onload = () => {
    if (typeof createUnityInstance !== "function") {
      unityShowBanner("Unity loader did not initialize.", "error");
      return;
    }

    createUnityInstance(
      canvas,
      config,
      (progress) => {
        progressBarFull.style.width =
          (progress * 100) + "%";
      }
    ).then(() => {
      loadingBar.style.display = "none";
.catch((error) => {
    console.error("UNITY GAME ERROR:", error);
    unityShowBanner(String(error), "error");
});
  };

  script.onerror = () => {
    unityShowBanner(
      "Could not load " + LOADER_URL,
      "error"
    );
  };

  document.body.appendChild(script);
}

loadAllParts();
</script>
  </body>
</html>
